name: ConDutCal CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    # Grant permissions to push the site to gh-pages branch
    permissions:
      contents: write 

    defaults:
      run:
        working-directory: ./con-dut-cal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./con-dut-cal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest & Axe Accessibility Tests
        run: npm run test

      - name: Configure Git User (for deployment bot)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        # Deploy if pushing to main and tests pass
        if: github.ref == 'refs/heads/main'
        run: npm run deploy