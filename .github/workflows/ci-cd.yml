name: ConDutCal CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    # Grant permissions to push the site to gh-pages branch
    permissions:
      contents: write 

    defaults:
      run:
        working-directory: ./con-dut-cal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./con-dut-cal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest & Axe Accessibility Tests
        run: npm run test

      - name: Build the React app
        # Only build for deployment if we are on the main branch
        if: github.ref == 'refs/heads/main'
        run: npm run build

      - name: Deploy to GitHub Pages
        # Only deploy if pushing to main and tests pass
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./con-dut-cal/dist